<body>

<header class="header">

<div class="logo">

<ion-icon name="people-outline"></ion-icon>

<h2>Assign Fees</h2>

</div>

<nav class="navbar">

<a href="fees.html">

Dashboard

<section class="lesson-container">

<h1>Assign Fees to Students</h1>

<p>Select a grade and assign the fee structure to all students.</p>

<div class="lesson-card">

<form id="assignFeesForm">

<label>Academic Year</label>

<input
type="text"
id="academicYear"
placeholder="Example: 2026"
required>

<label>Grade</label>

<select id="grade" required>

<option value="">Select Grade</option>

</select>

<label>Fee Category</label>

<select id="feeCategory" required>

<option value="">Select Fee Category</option>

<option value="School Fees">School Fees</option>

<option value="Examination Fees">Examination Fees</option>

<option value="Other Fees">Other Fees</option>

</select>

<button
type="button"
id="loadStudentsBtn"
class="btn">

Load Students

</button>

<div id="studentsContainer">

<p>Select a grade and click <strong>Load Students</strong>.</p>

</div>

<button
type="submit"
class="btn">

Assign Fees

</button>

</form>

</div>

</section>

<footer>

<h3>© 2026 SixMultPhare Education</h3>
