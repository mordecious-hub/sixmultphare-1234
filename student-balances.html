<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Balances | SixMultPhare Education</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">

</head>

<body>

<header class="header">

<div class="logo">

<ion-icon name="wallet-outline"></ion-icon>

<h2>Student Balances</h2>

</div>

<nav class="navbar">

<a href="fees.html">

<ion-icon name="arrow-back-outline"></ion-icon>

Fees

</a>

<a href="institution-dashboard.html">

<ion-icon name="grid-outline"></ion-icon>

Dashboard

</a>

</nav>

</header>

<section class="dashboard">

<h1>Student Fee Balances</h1>

<p>View outstanding balances and payment status for all students.</p>

<div class="lesson-card">

<div class="filters">

<input
type="text"
id="searchStudent"
placeholder="Search by student name or admission number">

<select id="statusFilter">

<option value="">All Status</option>

<option value="Paid">Paid</option>

<option value="Partial">Partial</option>

<option value="Outstanding">Outstanding</option>

</select>

<button
id="searchBtn"
class="btn">

Search

</button>

</div>

<div class="table-container">

<table>

<thead>

<tr>

<th>Student</th>

<th>Grade</th>

<th>Fee Category</th>

<th>Total Fee</th>

<th>Paid</th>

<th>Balance</th>

<th>Status</th>

</tr>

</thead>

<tbody id="balancesTable">

<tr>

<td colspan="7">

Loading balances...

</td>

</tr>

</tbody>

</table>

</div>

</div>

</section>

<footer>

<h3>© 2026 SixMultPhare Education</h3>
