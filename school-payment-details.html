<section class="lesson-container">

<h1>School Payment Details</h1>

<p>Enter the payment details parents and students will use to pay school fees.</p>

<div class="lesson-card">

<form id="paymentDetailsForm">

<label>Bank Name</label>

<input
type="text"
id="bankName"
placeholder="Example: Zanaco">

<label>Account Name</label>

<input
type="text"
id="accountName"
placeholder="School Account Name">

<label>Account Number</label>

<input
type="text"
id="accountNumber"
placeholder="Bank Account Number">

<label>MTN MoMo Number</label>

<input
type="text"
id="mtnNumber"
placeholder="MTN Mobile Money Number">

<label>Airtel Money Number</label>

<input
type="text"
id="airtelNumber"
placeholder="Airtel Money Number">

<label>Zamtel Money Number</label>

<input
type="text"
id="zamtelNumber"
placeholder="Zamtel Money Number">

<label>Finance Email</label>

<input
type="email"
id="financeEmail"
placeholder="finance@school.com">

<label>Finance Phone Number</label>

<input
type="tel"
id="financePhone"
placeholder="+260...">

<button
type="submit"
class="btn">

Save Payment Details

</button>

</form>

</div>

</section>
