<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register | SixMultPhare Education</title>

    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet" href="css/responsive.css">

</head>

<body>

<header class="header">

    <div class="logo">

        <ion-icon name="school-outline"></ion-icon>

        <h2>SixMultPhare</h2>

    </div>

    <nav class="navbar">

        <a href="index.html">

            <ion-icon name="home-outline"></ion-icon>

            Home

        </a>

        <a href="login.html">

            <ion-icon name="log-in-outline"></ion-icon>

            Login

        </a>

    </nav>

</header>

<section class="hero">

    <div class="card" style="max-width:550px;width:100%;">

        <ion-icon
        name="person-add-outline"></ion-icon>

        <h2>

            Create Account

        </h2>

        <p>

            Join SixMultPhare Education today.

        </p>

        <br>

        <form id="registerForm">

            <input
            type="text"
            id="fullName"
            placeholder="Full Name"
            required>

            <input
            type="email"
            id="email"
            placeholder="Email Address"
            required>

            <input
            type="password"
            id="password"
            placeholder="Password"
            required>

            <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm Password"
            required>

            <button
            type="submit"
            class="btn">

                <ion-icon
                name="person-add-outline"></ion-icon>

                Create Account

            </button>

        </form>

        <br>

        <p>

            Already have an account?

            <a href="login.html">

                Login Here

            </a>

        </p>

    </div>

</section>

<footer>

    <h3>

        © 2026 SixMultPhare Education

    </h3>

</footer>

<script type="module"
src="js/firebase.js"></script>

<script type="module"
src="js/auth.js"></script>

<script type="module"
src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>

<script nomodule
src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>

</body>

</html>
