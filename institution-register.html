<section class="dashboard">

<h1>Register Institution</h1>

<p>Secondary Schools, Colleges and Universities can register here.</p>

<div class="card" style="max-width:700px;margin:auto;">

<form id="institutionForm">

<input type="text" id="institutionName" placeholder="Institution Name" required>

<input type="email" id="email" placeholder="Official Email" required>

<input type="tel" id="phone" placeholder="Phone Number" required>

<select id="type" required>

<option value="">Select Institution Type</option>

<option value="Secondary School">Secondary School</option>

<option value="College">College</option>

<option value="University">University</option>

</select>

<input type="text" id="country" placeholder="Country" required>

<input type="text" id="province" placeholder="Province / State" required>

<input type="text" id="district" placeholder="District / City" required>

<button class="btn" type="submit">

<ion-icon name="send-outline"></ion-icon>

Submit Registration

</button>

</form>

</div>

</section>
