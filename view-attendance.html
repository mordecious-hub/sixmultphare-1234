<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>View Attendance | SixMultPhare Education</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
<link rel="stylesheet" href="css/view-attendance.css">

</head>

<body>

<header class="header">

<div class="logo">

<ion-icon name="list-outline"></ion-icon>

<h2>View Attendance</h2>

</div>

<nav class="navbar">

<a href="attendance.html">

<ion-icon name="arrow-back-outline"></ion-icon>

Attendance

</a>

<a href="institution-dashboard.html">

<ion-icon name="grid-outline"></ion-icon>

Dashboard

</a>

</nav>

</header>

<section class="dashboard">

<h1>Attendance Records</h1>

<p>View and manage all attendance records.</p>

<div class="lesson-card">

<div class="filters">

<input
type="date"
id="filterDate">

<select id="filterGrade">

<option value="">All Grades</option>

<option>Grade 8</option>

<option>Grade 9</option>

<option>Grade 10</option>

<option>Grade 11</option>

<option>Grade 12</option>

</select>

<select id="filterClass">

<option value="">All Classes</option>

<option>Grade 8A</option>

<option>Grade 8B</option>

<option>Grade 9A</option>

<option>Grade 10A</option>

<option>Grade 11A</option>

<option>Grade 12A</option>

</select>

<button id="searchBtn" class="btn">

Search

</button>

</div>

<div class="table-container">

<table>

<thead>

<tr>

<th>Student</th>

<th>Grade</th>

<th>Class</th>

<th>Date</th>

<th>Status</th>

<th>Action</th>

</tr>

</thead>

<tbody id="attendanceTable">

<tr>

<td colspan="6">

Loading attendance...

</td>

</tr>

</tbody>

</table>

</div>

</div>

</section>

<footer>

<h3>© 2026 SixMultPhare Education</h3>

</footer>

<script type="module" src="js/view-attendance.js"></script>

<script type="module"
src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>

<script nomodule
src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>

</body>

</html>
