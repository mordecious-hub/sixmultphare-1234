<body>

<header class="header">

<div class="logo">

<ion-icon name="card-outline"></ion-icon>

<h2>Record Payment</h2>

</div>

<nav class="navbar">

<a href="fees.html">

Fees

</a>

<a href="institution-dashboard.html">

<ion-icon name="grid-outline"></ion-icon>

Dashboard

</a>

</nav>

<section class="lesson-container">

<h1>Record Student Payment</h1>

<p>Search for a student and record fee payments.</p>

<div class="lesson-card">

<form id="paymentForm">

<label>Search Student</label>

<input
type="text"
id="studentSearch"
placeholder="Enter student name or admission number">

<button
type="button"
id="searchStudentBtn"
class="btn">

Search Student

</button>

<div id="studentDetails">

<p>No student selected.</p>

</div>

<label>Fee Category</label>

<select id="feeCategory" required>

<option value="">Select Fee Category</option>

<option value="School Fees">School Fees</option>

<option value="Examination Fees">Examination Fees</option>

<option value="Other Fees">Other Fees</option>

</select>

<label>Amount Paid (ZMW)</label>

<input
type="number"
id="amountPaid"
placeholder="Enter amount paid"
min="1"
required>

<label>Payment Method</label>

<select id="paymentMethod" required>

<option value="">Select Payment Method</option>

<option value="Cash">Cash</option>

<option value="Bank Transfer">Bank Transfer</option>

<option value="Mobile Money">Mobile Money</option>

</select>

<button
type="submit"
class="btn">

Record Payment

</button>

</form>

</div>

</section>
