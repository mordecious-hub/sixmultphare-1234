<section class="lesson-container">

<h1>Create New Examination</h1>

<p>Fill in the examination details below.</p>

<div class="lesson-card">

<form id="examForm">

<label>Examination Name</label>

<input
type="text"
id="examName"
placeholder="e.g. Mid-Term Examination"
required>

<label>Subject</label>

<select id="subject" required>

<option value="">Select Subject</option>

<option>Mathematics</option>

<option>English</option>

<option>Biology</option>

<option>Chemistry</option>

<option>Physics</option>

<option>Computer Studies</option>

<option>Geography</option>

<option>History</option>

<option>Civic Education</option>

</select>

<label>Grade</label>

<select id="grade" required>

<option value="">Select Grade</option>

<option>Grade 8</option>

<option>Grade 9</option>

<option>Grade 10</option>

<option>Grade 11</option>

<option>Grade 12</option>

</select>

<label>Class</label>

<select id="assignedClass" required>

<option value="">Select Class</option>

<option>Grade 8A</option>

<option>Grade 8B</option>

<option>Grade 9A</option>

<option>Grade 10A</option>

<option>Grade 11A</option>

<option>Grade 12A</option>

</select>

<label>Academic Term</label>

<select id="term" required>

<option value="">Select Term</option>

<option>Term 1</option>

<option>Term 2</option>

<option>Term 3</option>

</select>

<label>Academic Year</label>

<input
type="number"
id="year"
placeholder="2026"
required>

<label>Examination Date</label>

<input
type="date"
id="examDate"
required>

<label>Total Marks</label>

<input
type="number"
id="totalMarks"
placeholder="100"
required>

<button type="submit" class="btn">

Create Examination

</button>

</form>

</div>

</section>
