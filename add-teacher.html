<section class="lesson-container">

<h1>Register Teacher</h1>

<p>Complete the form below to add a new teacher.</p>

<div class="lesson-card">

<form id="teacherForm">

<label>Full Name</label>
<input type="text" id="fullName" placeholder="Enter full name" required>

<label>Email Address</label>
<input type="email" id="email" placeholder="teacher@example.com" required>

<label>Phone Number</label>
<input type="tel" id="phone" placeholder="+260..." required>

<label>Subject</label>
<select id="subject" required>
<option value="">Select Subject</option>
<option>Mathematics</option>
<option>English</option>
<option>Biology</option>
<option>Chemistry</option>
<option>Physics</option>
<option>Computer Studies</option>
<option>Geography</option>
<option>History</option>
<option>Civic Education</option>
</select>

<label>Assigned Class</label>
<select id="class" required>
<option value="">Select Class</option>
<option>Grade 8A</option>
<option>Grade 8B</option>
<option>Grade 9A</option>
<option>Grade 10A</option>
<option>Grade 11A</option>
<option>Grade 12A</option>
</select>

<label>Password</label>
<input type="password" id="password" placeholder="Create password" required>

<button type="submit" class="btn">

Create Teacher

</button>

</form>

</div>

</section>
