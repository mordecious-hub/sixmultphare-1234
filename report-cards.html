<section class="dashboard">

<h1>Generate Report Cards</h1>

<p>Select a student and examination term to generate a professional report card.</p>

<div class="lesson-card">

<form id="reportForm">

<label>Select Student</label>

<select id="studentSelect" required>

<option value="">Loading students...</option>

</select>

<label>Select Academic Term</label>

<select id="term" required>

<option value="">Choose Term</option>

<option>Term 1</option>

<option>Term 2</option>

<option>Term 3</option>

</select>

<label>Academic Year</label>

<input
type="number"
id="year"
placeholder="2026"
required>

<button type="submit" class="btn">

Generate Report Card

</button>

</form>

</div>

<div id="reportCard" class="report-card">

<h2>Student Report Card</h2>

<p>Select a student and click <strong>Generate Report Card</strong>.</p>

</div>

</section>
